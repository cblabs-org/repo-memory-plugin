name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Enable git longpaths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run go vet
        run: go vet ./cmd/... ./internal/... ./packaging/...

      - name: Build CLI
        run: go build ./cmd/repo-memory

      - name: Run tests (with race detector)
        if: runner.os != 'Windows'
        run: go test -race ./cmd/... ./internal/... ./packaging/...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test ./cmd/... ./internal/... ./packaging/...

      - name: Verify doctor lint and reprojection integrity
        run: |
          go run ./cmd/repo-memory doctor .
          go run ./cmd/repo-memory reproject --dry-run .
