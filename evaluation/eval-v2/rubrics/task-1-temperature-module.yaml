# Blind Architectural & Convention Grading Rubric — Task 1
# Task: Waterproof DS18B20-Compatible Temperature Sensor Module
# Prompt: evaluation/eval-v2/tasks/task-1-temperature-module.txt
# Authored blind to evaluation condition from esp32-app-foundation framework interfaces and ADRs.

task_id: 1
task_slug: task-1-temperature-module
title: "Waterproof DS18B20-Compatible Temperature Sensor Module"
prompt_file: "evaluation/eval-v2/tasks/task-1-temperature-module.txt"
max_score: 100

criteria:
  - id: t1_data_source_and_config
    title: "IDataSource & IConfigurable Update Interval ([1s, 15m] in /mod/<ns>.json)"
    weight: 20
    description: >
      Implements IDataSource (fetchUpdate(const FetchContext&) or fetchUpdate) and IConfigurable
      (getConfigNamespace, applyConfig, serializeConfig, resetConfig) persisting the configurable
      update interval in /mod/<ns>.json and clamping it to [1s, 15m] (1000..900000 ms or 1..900 s).
    required_signals:
      - "IDataSource"
      - "fetchUpdate"
      - "IConfigurable"
      - "applyConfig|serializeConfig|getConfigNamespace"
      - "900000|900|15 * 60"

  - id: t1_u8g2_carousel_board
    title: "U8G2Display IDisplayBoard Permanent Carousel Screen"
    weight: 20
    description: >
      Implements IDisplayBoard with render(U8G2&), isExpired() returning false for permanent
      carousel residency (rather than true which evicts transient splash boards), and canAdvance().
    required_signals:
      - "IDisplayBoard"
      - "render\\s*\\(\\s*U8G2"
      - "isExpired"
      - "canAdvance"

  - id: t1_web_portal_top_level_tab
    title: "IWebContributor & ITabRegistry Top-Level Portal Nav Icon (Bare SVG Geometry)"
    weight: 20
    description: >
      Implements IWebContributor (registerRoutes, getApiPrefix()) and registers a top-level
      navigation tab via ITabRegistry::addTab with parent = nullptr and bare 24x24 Feather inner
      SVG geometry (no outer <svg> wrapper tag).
    required_signals:
      - "IWebContributor"
      - "registerRoutes"
      - "getApiPrefix"
      - "addTab"
      - "nullptr"
    forbidden_signals:
      - "<svg[\\s>]"

  - id: t1_mcp_contributor_stateless
    title: "IMCPContributor On-Device MCP Tool Registration with Stateless Lambda ([])"
    weight: 20
    description: >
      Implements IMCPContributor::registerMCPTools(MCPToolRegistry&) using a stateless
      non-capturing lambda ([]) compatible with MCPToolHandler function pointers and explicit
      mutatesState flags (false for read telemetry, true for interval configuration).
    required_signals:
      - "IMCPContributor"
      - "registerMCPTools"
      - "MCPToolRegistry"
      - "mutatesState"
      - "\\[\\s*\\]\\s*\\("

  - id: t1_application_unified_registration
    title: "Application::registerModule() Unified Registration & ADR-16 Static Scope"
    weight: 10
    description: >
      Declares the module at static/member scope (ADR-16, no unowned raw new heap leak) and
      wires it via Application::registerModule() (with #ifdef WITH_DISPLAY_U8G2 guard where applicable).
    required_signals:
      - "registerModule"

  - id: t1_native_tests_and_non_blocking
    title: "Native Unit Tests & Non-Blocking Main Loop (No delay())"
    weight: 10
    description: >
      Includes unit tests under test/ or passes pio test -e native, and avoids blocking delay()
      calls on the main execution loop.
    forbidden_signals:
      - "\\bdelay\\s*\\("
